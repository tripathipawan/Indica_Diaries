<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Indica Diaries | All my links</title>
  <meta name="description" content="Find Indica Diaries on YouTube, Instagram, Facebook, WhatsApp, X and LinkedIn.">
  <meta name="theme-color" content="#fff0f5">
  <meta property="og:title" content="Indica Diaries">
  <meta property="og:description" content="All my channels in one place.">
  <meta property="og:type" content="website">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #fff4f8;
      --ink: #2b1020;
      --muted: #8a6479;
      --rose: #ff4f93;
      --rose2: #ff8cbc;
      --deep: #d81b6a;
      --edge: rgba(200, 50, 110, .13);
      --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      overflow-x: hidden;
    }

    /* soft pink aurora, fixed behind everything */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(60vmax 45vmax at 8% -8%, rgba(255, 140, 188, .55), transparent 65%),
        radial-gradient(55vmax 40vmax at 100% 12%, rgba(255, 196, 160, .45), transparent 65%),
        radial-gradient(60vmax 50vmax at 60% 115%, rgba(214, 150, 255, .30), transparent 65%);
    }

    .page {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: max(40px, env(safe-area-inset-top)) clamp(18px, 5vw, 48px) max(28px, env(safe-area-inset-bottom));
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(28px, 5vw, 64px);
      align-items: center
    }

    header {
      text-align: center
    }

    .emblem {
      position: relative;
      width: clamp(120px, 34vw, 150px);
      aspect-ratio: 1;
      margin: 0 auto clamp(18px, 4vw, 26px);
      animation: rise .9s cubic-bezier(.2, .7, .2, 1) both
    }

    .emblem::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      filter: blur(18px);
      opacity: .75;
      background: conic-gradient(#ff4f93, #ffd2e4, #ff8cbc, #fff, #d81b6a, #ff4f93);
      animation: spin 14s linear infinite;
    }

    .disc {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 0 4px #fff, 0 24px 46px -14px rgba(216, 27, 106, .55)
    }

    .disc img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    h1 {
      font-weight: 800;
      font-size: clamp(34px, 10vw, 44px);
      line-height: 1.04;
      letter-spacing: -.035em;
      animation: rise .9s .08s both
    }

    h1 .b {
      background: linear-gradient(90deg, var(--deep), var(--rose) 55%, var(--rose2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .tag {
      margin: 14px auto 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: clamp(15px, 3.8vw, 17px);
      line-height: 1.65;
      animation: rise .9s .14s both
    }

    .panel {
      min-width: 0;
      animation: rise .9s .2s both
    }

    ul {
      list-style: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px
    }

    a.row {
      --mx: 50%;
      --my: 50%;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 20px;
      align-items: center;
      gap: 14px;
      padding: 13px 16px 13px 13px;
      border-radius: 20px;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 255, 255, .78);
      border: 1px solid var(--edge);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 2px rgba(150, 30, 80, .05), 0 14px 28px -18px rgba(216, 27, 106, .4);
      transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s;
    }

    a.row::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      background: radial-gradient(220px circle at var(--mx) var(--my), rgba(255, 79, 147, .14), transparent 70%)
    }

    a.row:hover,
    a.row:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 2px 4px rgba(150, 30, 80, .06), 0 22px 36px -18px rgba(216, 27, 106, .5)
    }

    a.row:hover::before {
      opacity: 1
    }

    a.row:focus-visible {
      outline: 2px solid var(--rose);
      outline-offset: 3px
    }

    .tile {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #ffe6f0, #ffd0e3);
      color: var(--deep);
      box-shadow: inset 0 1px 0 #fff;
      transition: background .3s, color .3s
    }

    a.row:hover .tile {
      background: linear-gradient(145deg, var(--rose2), var(--deep));
      color: #fff
    }

    .tile svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .tile svg.f {
      fill: currentColor;
      stroke: none
    }

    .txt {
      min-width: 0
    }

    .name {
      display: block;
      font-weight: 700;
      font-size: 16.5px;
      letter-spacing: -.01em
    }

    .sub {
      display: block;
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .chev {
      width: 20px;
      height: 20px;
      stroke: #c79ab1;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .3s, stroke .3s
    }

    a.row:hover .chev {
      transform: translateX(3px);
      stroke: var(--deep)
    }

    /* featured first link */
    a.row.hero {
      color: #fff;
      border-color: transparent;
      padding: 17px 18px 17px 15px;
      background: linear-gradient(120deg, var(--deep), var(--rose) 60%, var(--rose2));
      box-shadow: 0 20px 38px -16px rgba(216, 27, 106, .7)
    }

    a.row.hero::before {
      background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%);
      transform: translateX(-120%);
      opacity: 0;
      transition: transform .8s, opacity .2s
    }

    a.row.hero:hover::before {
      transform: translateX(120%);
      opacity: 1
    }

    a.row.hero .tile {
      background: rgba(255, 255, 255, .22);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4)
    }

    a.row.hero:hover .tile {
      background: rgba(255, 255, 255, .3)
    }

    a.row.hero .sub {
      color: rgba(255, 255, 255, .85)
    }

    a.row.hero .chev,
    a.row.hero:hover .chev {
      stroke: #fff
    }

    footer {
      margin-top: clamp(26px, 5vw, 44px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 13.5px
    }

    button {
      font: 600 14px var(--font);
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--edge);
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 18px -12px rgba(216, 27, 106, .55);
      transition: color .25s, transform .25s
    }

    button:hover {
      color: var(--deep);
      transform: translateY(-1px)
    }

    button:focus-visible {
      outline: 2px solid var(--rose);
      outline-offset: 3px
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(26px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 20px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      max-width: 90vw;
      text-align: center
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    /* mobile: single centered column, capped width so it never stretches */
    @media (max-width:899px) {
      .layout {
        max-width: 520px;
        margin: 0 auto;
        width: 100%
      }
    }

    /* tablet: two columns of links, featured one spans both */
    @media (min-width:600px) and (max-width:899px) {
      ul {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      li:first-child,
      li:last-child:nth-child(even) {
        grid-column: 1/-1
      }

      .layout {
        max-width: 680px
      }
    }

    /* desktop: split layout, intro left, links right */
    @media (min-width:900px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) minmax(0, 480px)
      }

      header {
        text-align: left
      }

      .emblem {
        width: clamp(180px, 20vw, 240px);
        margin-left: 0
      }

      h1 {
        font-size: clamp(52px, 6vw, 76px)
      }

      .tag {
        margin-left: 0;
        font-size: 18px;
        max-width: 30ch
      }

      .panel {
        padding: clamp(18px, 2vw, 28px);
        border-radius: 32px;
        background: rgba(255, 255, 255, .45);
        border: 1px solid rgba(255, 255, 255, .8);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        box-shadow: 0 40px 80px -40px rgba(216, 27, 106, .45)
      }
    }

    @media (max-width:360px) {
      a.row {
        grid-template-columns: 44px minmax(0, 1fr) 18px;
        gap: 12px;
        padding-right: 12px
      }

      .tile {
        width: 44px;
        height: 44px
      }

      .name {
        font-size: 15.5px
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="layout">
      <header>
        <div class="emblem">
          <div class="disc"><img src="logo.png" alt="Indica Diaries logo" width="240" height="240"></div>
        </div>
        <h1>Indica <span class="b">Diaries</span></h1>
        <p class="tag">Stories, ideas and updates from India. Pick a channel and join in.</p>
      </header>
      <div class="panel">
        <ul id="links"></ul>
      </div>
    </div>
    <footer>
      <span>&copy; <span id="yr"></span> Indica Diaries</span>
      <button id="share" type="button">Share this page</button>
    </footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    /* Edit this list to add, remove or reorder links. The first one is shown as the big featured button. */
    var LINKS = [
      {
        name: "YouTube", sub: "Watch the latest videos", url: "https://youtube.com/@indicadiaries?si=Jd_TW67dI8GC2plt",
        icon: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5l4.5 2.5-4.5 2.5z"/>'
      },
      {
        name: "Instagram", sub: "@indicadiaries.in", url: "https://www.instagram.com/indicadiaries.in?dlrf=aGlxaXFla2xoNXNw",
        icon: '<rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4"/><path d="M17.3 6.7h.01"/>'
      },
      {
        name: "WhatsApp Channel", sub: "Updates on your phone", url: "https://whatsapp.com/channel/0029Vb7sg2V3bbV4NpadBX1m",
        icon: '<path d="M4 20l1.3-4.2A8.5 8.5 0 1 1 8.4 18.8z"/><path d="M9.2 8.8c.3 2.6 2.4 4.9 5 5.6l1.2-1.3-1.9-1-.9.7c-.9-.4-1.6-1.1-2-2l.7-.9-1-1.9z"/>'
      },
      {
        name: "Facebook", sub: "Like and follow the page", url: "https://www.facebook.com/share/1K1sHVWRcy/", fill: true,
        icon: '<path d="M14.5 8H17V4.5h-2.7C11.6 4.5 10 6.2 10 8.8V11H7.5v3.5H10V21h3.5v-6.5h2.7l.5-3.5h-3.2V9.2c0-.8.4-1.2 1-1.2z"/>'
      },
      {
        name: "X (Twitter)", sub: "@Indicadiaries", url: "https://x.com/Indicadiaries",
        icon: '<path d="M5 4.5h3.6l10.4 15h-3.6z"/><path d="M18.6 4.5l-5.9 6.7M5.4 19.5l5.9-6.7"/>'
      },
      {
        name: "LinkedIn", sub: "Let\u2019s connect", url: "https://www.linkedin.com/in/pawantripathi/",
        icon: '<rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M8 10.5V16M8 7.8h.01M12 16v-5.5M12 13c0-1.6 1-2.6 2.4-2.6S17 11.3 17 13v3"/>'
      },
      {
        name: "Substack", sub: "@indicadiaries", url: "https://substack.com/@indicadiaries",
        icon: '<path d="M5 4.5h14M5 9h14"/><path d="M5 13.5h14V20l-7-3.8L5 20z"/>'
      },
      {
        name: "Indica Diaries Newsletter", sub: "On LinkedIn", url: "https://www.linkedin.com/newsletters/indica-diaries-7519989539940110336/",
        icon: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/>'
      },
      {
        name: "Tech Eden Newsletter", sub: "Developer insights on LinkedIn", url: "https://www.linkedin.com/newsletters/tech-eden-developer-insights-7483395366604800000/",
        icon: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/>'
      }
    ];

    var list = document.getElementById("links");
    LINKS.forEach(function (l, i) {
      var li = document.createElement("li");
      li.innerHTML =
        '<a class="row' + (i === 0 ? ' hero' : '') + '" href="' + l.url + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="tile"><svg viewBox="0 0 24 24" class="' + (l.fill ? 'f' : '') + '" aria-hidden="true">' + l.icon + '</svg></span>' +
        '<span class="txt"><span class="name">' + l.name + '</span><span class="sub">' + l.sub + '</span></span>' +
        '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>';
      list.appendChild(li);
    });

    list.addEventListener("pointermove", function (e) {
      var a = e.target.closest && e.target.closest("a.row");
      if (!a) return;
      var r = a.getBoundingClientRect();
      a.style.setProperty("--mx", (e.clientX - r.left) + "px");
      a.style.setProperty("--my", (e.clientY - r.top) + "px");
    });

    document.getElementById("yr").textContent = new Date().getFullYear();

    var toast = document.getElementById("toast"), t;
    function say(msg) {
      toast.textContent = msg; toast.classList.add("show");
      clearTimeout(t); t = setTimeout(function () { toast.classList.remove("show"); }, 2200);
    }
    document.getElementById("share").addEventListener("click", function () {
      var data = { title: "Indica Diaries", text: "Find all my channels here", url: location.href };
      if (navigator.share) { navigator.share(data).catch(function () { }); return; }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(location.href).then(function () { say("Link copied"); }, function () { say("Copy failed. Copy the address bar link instead."); });
      } else { say("Copy the address bar link to share."); }
    });
  </script>
</body>

</html>
